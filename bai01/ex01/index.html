<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 01 - Trang thơ Bốn mùa</title>
    <style>
        :root {
            --nen-vang-nhat: #FFFDE7;
            --vien-xam-manh: #9E9E9E;
            --mau-chu-do-dam: #D40000;
            --nen-hong-phan: #FFD9E6;
            --mau-xanh-duong: #0033CC;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .khung-tho {
            width: 640px;
            background-color: var(--nen-vang-nhat);
            border: 1px solid var(--vien-xam-manh);
            padding: 24px;
            text-align: center;
        }
        h1 {
            color: var(--mau-chu-do-dam);
            background-color: var(--nen-hong-phan);
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            padding: 6px 0;
            margin: 0 0 20px;
            text-transform: uppercase;
        }
        p {
            font-style: italic;
            line-height: 1.7;
        }
        .kho-xanh {
            color: var(--mau-xanh-duong);
        }
        .kho-do {
            color: var(--mau-chu-do-dam);
        }
        hr {
            width: 55%;
            border: none;
            border-top: 1px solid var(--mau-xanh-duong);
        }
    </style>
</head>
<body>
    <article class="khung-tho">
        <h1>BỐN MÙA</h1>
        <p class="kho-xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>
        <hr>
        <p class="kho-do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>
        <hr>
        <p class="kho-xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
    </article>
</body>
</html>
